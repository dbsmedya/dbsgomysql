# Database-backed matrix across every supported MySQL version.
#
# Deliberately NOT on every push. It is slow and container-heavy, and running
# it per-push while the suite is small trains everyone to ignore CI. It becomes
# a per-push gate once the integration suite is meaningful.
#
# Trigger it by:
#   - pushing a version tag (release gate),
#   - the Actions "Run workflow" button,
#   - adding the `run-integration` label to a pull request.
#
# The MySQL 26.x development line is watch-only and is not in the matrix until
# practical images exist; when added it runs as allowed-to-fail.

name: Integration

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: mysql ${{ matrix.mysql }}
    # Skip label-triggered runs unless the label is actually present.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4", "9.7"]
        # Each version's source-replica trio and its host ports, which are
        # disjoint per version so the compose file can describe all three
        # without collision. The service prefix also spells the source
        # hostname the replicas connect to.
        include:
          - mysql: "8.0"
            repl_prefix: repl80
            source_port: 3580
            replica_port: 3680
            silent_port: 3780
            gr_project: gr80
            gr_port_1: 4180
            gr_port_2: 4280
            gr_port_3: 4380
            gr_port_installed: 4780
            gr_port_disabled: 4880
            gr_port_ext: 4980
          - mysql: "8.4"
            repl_prefix: repl84
            source_port: 3584
            replica_port: 3684
            silent_port: 3784
            gr_project: gr84
            gr_port_1: 4184
            gr_port_2: 4284
            gr_port_3: 4384
            gr_port_installed: 4784
            gr_port_disabled: 4884
            gr_port_ext: 4984
          - mysql: "9.7"
            repl_prefix: repl97
            source_port: 3597
            replica_port: 3697
            silent_port: 3797
            gr_project: gr97
            gr_port_1: 4197
            gr_port_2: 4297
            gr_port_3: 4397
            gr_port_installed: 4797
            gr_port_disabled: 4897
            gr_port_ext: 4997

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DBSGOMYSQL_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/"
      DBSGOMYSQL_TEST_MYSQL_VERSION: ${{ matrix.mysql }}
      # The replication layers need a source and two replicas of this version.
      # A `services:` block cannot express them — the replicas resolve the
      # source by name and must not start before it is healthy — so they come
      # from the same compose file developers run locally.
      DBSGOMYSQL_TEST_SOURCE_DSN: "root:root@tcp(127.0.0.1:${{ matrix.source_port }})/"
      DBSGOMYSQL_TEST_REPLICA_DSN: "root:root@tcp(127.0.0.1:${{ matrix.replica_port }})/"
      DBSGOMYSQL_TEST_SILENT_REPLICA_DSN: "root:root@tcp(127.0.0.1:${{ matrix.silent_port }})/"
      # The source as the replicas reach it: its compose service name, not the
      # host-mapped address the DSNs above use.
      DBSGOMYSQL_TEST_REPL_SOURCE_HOST: "${{ matrix.repl_prefix }}-source"
      # A skipped replication test is not evidence. With this set, a missing
      # DSN fails the job instead of quietly reducing what ran.
      DBSGOMYSQL_TEST_REQUIRE_REPLICATION: "1"
      # The Group Replication topology: a three-member cluster and three
      # standalone servers of this version, from the same compose file
      # developers run locally.
      GR_IMAGE: mysql:${{ matrix.mysql }}
      GR_PORT_1: ${{ matrix.gr_port_1 }}
      GR_PORT_2: ${{ matrix.gr_port_2 }}
      GR_PORT_3: ${{ matrix.gr_port_3 }}
      GR_PORT_INSTALLED: ${{ matrix.gr_port_installed }}
      GR_PORT_DISABLED: ${{ matrix.gr_port_disabled }}
      GR_PORT_EXT: ${{ matrix.gr_port_ext }}
      DBSGOMYSQL_TEST_GR_PRIMARY_DSN: "root:root@tcp(127.0.0.1:${{ matrix.gr_port_1 }})/"
      DBSGOMYSQL_TEST_GR_SECONDARY_DSN: "root:root@tcp(127.0.0.1:${{ matrix.gr_port_2 }})/"
      DBSGOMYSQL_TEST_GR_REJOINER_DSN: "root:root@tcp(127.0.0.1:${{ matrix.gr_port_3 }})/"
      DBSGOMYSQL_TEST_GR_INSTALLED_DSN: "root:root@tcp(127.0.0.1:${{ matrix.gr_port_installed }})/"
      DBSGOMYSQL_TEST_GR_DISABLED_DSN: "root:root@tcp(127.0.0.1:${{ matrix.gr_port_disabled }})/"
      DBSGOMYSQL_TEST_GR_EXT_DSN: "root:root@tcp(127.0.0.1:${{ matrix.gr_port_ext }})/"
      # gr-ext as the members reach it: its compose hostname.
      DBSGOMYSQL_TEST_GR_EXT_HOST: gr-ext
      DBSGOMYSQL_TEST_REQUIRE_GROUP_REPLICATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned Go version
        id: go
        run: echo "version=$(make -s print-go-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The Makefile pins the toolchain; there is no second place to bump.
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      # `--wait` blocks until every named service reports healthy, so the
      # topology is ready before the readiness loop below records versions.
      - name: Start the replication topology
        run: |
          docker compose -f tests/docker/compose_replication.yaml up -d --wait \
            ${{ matrix.repl_prefix }}-source \
            ${{ matrix.repl_prefix }}-replica \
            ${{ matrix.repl_prefix }}-silent

      # `--wait` returns when every cluster member reports itself ONLINE.
      - name: Start the group replication topology
        run: |
          docker compose -p ${{ matrix.gr_project }} \
            -f tests/docker/compose_group_replication.yaml up -d --wait --wait-timeout 300

      # Moving-tag evidence: mysql:8.0, :8.4, and :9.7 are moving tags, so the
      # run records which releases every server actually was.
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"
              for p in 3306 ${{ matrix.source_port }} ${{ matrix.replica_port }} ${{ matrix.silent_port }} ${{ matrix.gr_port_1 }} ${{ matrix.gr_port_installed }} ${{ matrix.gr_port_disabled }} ${{ matrix.gr_port_ext }}; do
                mysql -h 127.0.0.1 -P "$p" -uroot -proot -e 'SELECT VERSION();'
              done
              exit 0
            fi
            echo "waiting for MySQL ($i/30)"
            sleep 2
          done
          echo "::error::MySQL did not become ready"
          exit 1

      - name: Integration tests
        run: make test-integration

      - name: End-to-end tests
        run: make test-e2e

      - name: Dump replication topology logs
        if: failure()
        run: docker compose -f tests/docker/compose_replication.yaml logs --no-color

      - name: Dump group replication topology logs
        if: failure()
        run: docker compose -p ${{ matrix.gr_project }} -f tests/docker/compose_group_replication.yaml logs --no-color
