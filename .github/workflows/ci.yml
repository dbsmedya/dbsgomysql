# Per-commit gate. Runs the same `make check` a developer runs locally, so a
# green CI and a green workstation mean the same thing.
#
# Requires no database: DB-backed tests sit behind the `integration` and `e2e`
# build tags and are exercised by integration.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Tracks the module's declared floor; no second place to bump.
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          # The Makefile pins the version; there is no second place to bump.
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(make -s print-golangci-version)"
          golangci-lint --version

      # One step, not a re-listing of the gate's targets. `make check` is the
      # gate; running it verbatim is what makes a green workstation and a green
      # CI mean the same thing.
      - name: make check
        run: make check
