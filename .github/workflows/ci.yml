# Per-commit gate. Runs the same `make check` a developer runs locally, so a
# green CI and a green workstation mean the same thing.
#
# The check job requires no database. A separate MySQL 8.4 smoke job runs every
# shipped fact and check once against the repository-owned fixture, against a
# standalone server and a source-replica trio started from the repository's own
# compose file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned Go version
        id: go
        run: echo "version=$(make -s print-go-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod's `toolchain` directive is the single source of truth; the
          # Makefile reads it and exports it as GOTOOLCHAIN, so `make check`
          # runs that exact toolchain whatever is provisioned here. Asking for
          # it by name keeps this step from installing a different one and
          # paying for a second download.
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      # The same target contributors run, so CI and a workstation end up with
      # the same artifact rather than the same version number. `go install`
      # here with GOTOOLCHAIN=auto used to build it with whatever release
      # golangci-lint's own floor pulled in, which is not what local package
      # managers produce.
      - name: Install pinned golangci-lint
        run: make tools

      # One step, not a re-listing of the gate's targets. `make check` is the
      # gate; running it verbatim is what makes a green workstation and a green
      # CI mean the same thing.
      - name: make check
        run: make check

  smoke:
    name: smoke
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DBSGOMYSQL_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/"
      DBSGOMYSQL_TEST_MYSQL_VERSION: "8.4"
      # The replication smoke coverage needs a source and two replicas, which
      # a `services:` block cannot express — replicas must reach the source by
      # name on a shared network, and the source must be healthy before they
      # start. The repository's own compose file already states exactly that,
      # so the topology comes up as a step instead.
      DBSGOMYSQL_TEST_SOURCE_DSN: "root:root@tcp(127.0.0.1:3584)/"
      DBSGOMYSQL_TEST_REPLICA_DSN: "root:root@tcp(127.0.0.1:3684)/"
      DBSGOMYSQL_TEST_SILENT_REPLICA_DSN: "root:root@tcp(127.0.0.1:3784)/"
      # The hostname as the replicas reach the source: its compose service
      # name, not the host-mapped address the DSNs above use.
      DBSGOMYSQL_TEST_REPL_SOURCE_HOST: "repl84-source"
      # A skipped replication test is not evidence. With this set, a missing
      # DSN fails the job instead of quietly reducing what ran.
      DBSGOMYSQL_TEST_REQUIRE_REPLICATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned Go version
        id: go
        run: echo "version=$(make -s print-go-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      # The same compose file developers run locally, which is what makes a
      # green smoke job and a green workstation mean the same thing. `--wait`
      # blocks until every named service reports healthy.
      - name: Start the replication topology
        run: |
          docker compose -f tests/docker/compose_replication.yaml up -d --wait \
            repl84-source repl84-replica repl84-silent

      # Moving-tag evidence: mysql:8.4 is a moving tag, so the run records
      # which releases it actually tested against.
      - name: Record topology server versions
        run: |
          for p in 3584 3684 3784; do
            mysql -h 127.0.0.1 -P "$p" -uroot -proot -e 'SELECT VERSION();'
          done

      - name: Smoke tests
        run: make test-smoke

      - name: Dump replication topology logs
        if: failure()
        run: docker compose -f tests/docker/compose_replication.yaml logs --no-color
